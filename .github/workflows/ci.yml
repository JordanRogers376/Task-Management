name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore TaskManagement.sln

      - name: Build
        run: dotnet build TaskManagement.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TaskManagement.sln --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish src/TaskManagement.Api/TaskManagement.Api.csproj --configuration Release --output ./publish/api

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish/api
